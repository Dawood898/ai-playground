<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#181716">

  <link rel="preconnect" href="https://challenges.cloudflare.com">

  <!-- async+defer keeps the page non-blocking; render happens via onTurnstileLoad.
       turnstile.ready() refuses to run with async/defer, so we must use onload. -->
  <script
    src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onTurnstileLoad"
    async
    defer>
  </script>

  <style>
    :root {
      --bg: #181716;
      --panel: #242321;
      --panel-hover: #292725;

      --border: #373532;
      --border-hover: #45413d;

      --text: #e6e1da;
      --text-secondary: #aaa49c;
      --muted: #77716a;
      --muted-dark: #5d5954;

      --success: #789878;
      --warning: #b38d53;
      --danger: #b76a63;

      --content-width: 790px;
      --composer-width: 950px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;

      background: var(--bg);
      color: var(--text);

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      -webkit-font-smoothing: antialiased;
    }

    button,
    select,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
    }

    /* ==========================================================
       APP
    ========================================================== */

    .app {
      width: 100%;
      height: 100%;

      position: relative;

      display: flex;
      flex-direction: column;
    }

    /* ==========================================================
       TOP BAR
    ========================================================== */

    .topbar {
      height: 56px;
      flex-shrink: 0;

      display: flex;
      align-items: center;

      padding: 0 28px;

      border-bottom: 1px solid rgba(255,255,255,.025);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .topbar-title {
      color: #a49f98;

      font-size: 12px;
      font-weight: 500;
    }

    .topbar-spacer {
      flex: 1;
    }

    .rpm {
      display: flex;
      align-items: center;
      gap: 7px;

      color: var(--muted);

      font-size: 11px;
    }

    .rpm-dot {
      width: 5px;
      height: 5px;

      border-radius: 50%;

      background: var(--success);
    }

    .rpm.warn {
      color: var(--warning);
    }

    .rpm.warn .rpm-dot {
      background: var(--warning);
    }

    /* ==========================================================
       MAIN
    ========================================================== */

    main {
      flex: 1;
      min-height: 0;

      overflow-y: auto;

      scrollbar-width: thin;
      scrollbar-color: #34312e transparent;
    }

    .page {
      width: min(var(--content-width), calc(100% - 48px));

      margin: 0 auto;

      padding:
        92px
        0
        195px;
    }

    /* ==========================================================
       EMPTY STATE
    ========================================================== */

    .empty-state {
      width: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;
    }

    .empty-state.hidden {
      display: none;
    }

    .empty-icon {
      width: 36px;
      height: 36px;

      display: grid;
      place-items: center;

      margin-bottom: 19px;

      border: 1px solid var(--border);

      color: #8b857d;

      background: rgba(255,255,255,.006);
    }

    .empty-icon svg {
      width: 15px;
      height: 15px;
    }

    .empty-state h1 {
      margin: 0;

      color: #e3ded7;

      font-size: 24px;
      font-weight: 600;

      line-height: 1.15;

      letter-spacing: -.025em;
    }

    .empty-state p {
      max-width: 520px;

      margin: 10px 0 0;

      color: #918b84;

      font-size: 13px;

      line-height: 1.55;
    }

    /* ==========================================================
       STARTERS
    ========================================================== */

    .starter-grid {
      width: min(650px, 100%);

      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 8px;

      margin-top: 29px;
    }

    .starter {
      min-height: 39px;

      display: flex;
      align-items: center;

      gap: 9px;

      padding: 9px 11px;

      border: 1px solid var(--border);

      background: rgba(255,255,255,.006);

      color: #d5d0c8;

      text-align: left;

      cursor: pointer;

      transition:
        background .15s ease,
        border-color .15s ease;
    }

    .starter:hover {
      background: var(--panel-hover);
      border-color: var(--border-hover);
    }

    .starter-icon {
      width: 14px;
      height: 14px;

      flex-shrink: 0;

      color: #79736c;
    }

    .starter span {
      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;

      font-size: 12.5px;
    }

    /* ==========================================================
       MESSAGES
    ========================================================== */

    .messages {
      display: flex;
      flex-direction: column;

      gap: 31px;
    }

    .message {
      animation:
        messageIn .18s ease both;
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(3px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message-role {
      margin-bottom: 6px;

      color: var(--muted-dark);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      font-size: 9.5px;
      font-weight: 600;

      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .message-body {
      color: #cbc6bf;

      font-size: 14px;

      line-height: 1.72;

      white-space: pre-wrap;

      word-break: break-word;
    }

    .message.user {
      padding-left: 25px;
    }

    .message.user .message-body {
      color: #ded9d1;
    }

    .message.error {
      padding: 12px 14px;

      border: 1px solid rgba(183,106,99,.28);

      background: rgba(183,106,99,.055);
    }

    .message.error .message-role {
      color: var(--danger);
    }

    /* ==========================================================
       STREAMING CURSOR
    ========================================================== */

    .cursor .message-body::after {
      content: "▋";

      display: inline-block;

      margin-left: 2px;

      color: #aaa49c;

      animation:
        blink .9s steps(1) infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    /* ==========================================================
       CODE
    ========================================================== */

    .message-body code {
      padding: 2px 5px;

      border: 1px solid var(--border);

      background: #11100f;

      font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

      font-size: 12px;
    }

    .message-body pre {
      overflow-x: auto;

      margin: 14px 0;

      padding: 14px;

      border: 1px solid var(--border);

      background: #11100f;

      font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

      font-size: 12px;

      line-height: 1.65;
    }

    .message-body a {
      color: #d7d2cb;

      text-decoration: underline;

      text-underline-offset: 3px;
    }

    /* ==========================================================
       COMPOSER BACKDROP
    ========================================================== */

    .composer-area {
      position: absolute;

      left: 0;
      right: 0;
      bottom: 0;

      display: flex;
      justify-content: center;

      padding:
        0 24px
        18px;

      pointer-events: none;

      background:
        linear-gradient(
          to bottom,
          transparent 0,
          rgba(24,23,22,.58) 22%,
          rgba(24,23,22,.92) 58%,
          var(--bg) 100%
        );

      z-index: 10;
    }

    .composer-wrap {
      width: min(
        var(--composer-width),
        100%
      );

      pointer-events: auto;
    }

    /* ==========================================================
       COMPOSER
    ========================================================== */

    .composer {
      width: 100%;

      border: 1px solid var(--border);

      background: var(--panel);

      box-shadow:
        0 9px 32px rgba(0,0,0,.12);
    }

    .input-area {
      min-height: 86px;
    }

    textarea {
      width: 100%;

      min-height: 86px;
      max-height: 180px;

      display: block;

      resize: none;

      padding:
        15px 18px
        10px;

      border: 0;
      outline: 0;

      background: transparent;

      color: #ddd8d1;

      font-size: 14px;

      line-height: 1.6;
    }

    textarea::placeholder {
      color: #6e6963;
    }

    /* ==========================================================
       TOOLBAR
    ========================================================== */

    .toolbar {
      height: 50px;

      display: flex;
      align-items: center;

      padding: 0 10px;

      border-top: 1px solid var(--border);
    }

    .toolbar-left,
    .toolbar-right {
      display: flex;
      align-items: center;
    }

    .toolbar-left {
      gap: 2px;
    }

    .toolbar-right {
      margin-left: auto;

      gap: 6px;
    }

    .tool-button {
      width: 30px;
      height: 30px;

      display: grid;
      place-items: center;

      background: transparent;

      color: #6f6962;

      cursor: pointer;

      transition:
        color .14s ease,
        background .14s ease;
    }

    .tool-button:hover {
      color: #9c968e;

      background: #2b2926;
    }

    .tool-button svg {
      width: 15px;
      height: 15px;
    }

    .tool-divider {
      width: 1px;
      height: 18px;

      margin: 0 4px;

      background: var(--border);
    }

    /* ==========================================================
       MODEL
    ========================================================== */

    .model-control {
      position: relative;

      display: flex;
      align-items: center;
    }

    .model-control .model-icon {
      position: absolute;

      left: 10px;

      width: 12px;
      height: 12px;

      color: #7a746d;

      pointer-events: none;

      z-index: 2;
    }

    #model {
      appearance: none;
      -webkit-appearance: none;

      width: 170px;
      height: 32px;

      padding:
        0 27px
        0 30px;

      border: 1px solid var(--border);

      background: #282623;

      color: #bdb7af;

      outline: none;

      cursor: pointer;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      font-size: 10.5px;
    }

    #model:hover {
      background: #2c2926;

      border-color: var(--border-hover);
    }

    #model option {
      background: #242220;

      color: #ddd8d0;
    }

    .model-arrow {
      position: absolute;

      right: 8px;

      width: 11px;
      height: 11px;

      color: #67615b;

      pointer-events: none;
    }

    /* ==========================================================
       SEND
    ========================================================== */

    .send {
      height: 32px;

      display: flex;
      align-items: center;

      gap: 6px;

      padding: 0 11px;

      border: 1px solid var(--border);

      background: #292724;

      color: #79736d;

      cursor: pointer;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      font-size: 10.5px;

      transition:
        background .14s ease,
        color .14s ease,
        border-color .14s ease;
    }

    .send:hover:not(:disabled) {
      color: #b5afa7;

      background: #302d2a;

      border-color: var(--border-hover);
    }

    .send:disabled {
      opacity: .4;

      cursor: not-allowed;
    }

    .send svg {
      width: 13px;
      height: 13px;
    }

    /* ==========================================================
       TURNSTILE
       Kept visible (bottom-left): if Cloudflare ever escalates to an
       interactive challenge, a hidden widget could not be clicked and
       the site would deadlock. interaction-only mode hides it until
       that actually happens.
    ========================================================== */

    #turnstile-box {
      position: fixed;

      left: 14px;
      bottom: 14px;

      z-index: 60;
    }

    /* ==========================================================
       TOAST
    ========================================================== */

    .toast {
      position: fixed;

      left: 50%;
      bottom: 155px;

      transform:
        translate(-50%, 8px);

      padding:
        7px 11px;

      border: 1px solid var(--border);

      background: #292724;

      color: #c5bfb7;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      font-size: 10.5px;

      opacity: 0;

      pointer-events: none;

      transition:
        opacity .18s ease,
        transform .18s ease;

      z-index: 50;
    }

    .toast.show {
      opacity: 1;

      transform:
        translate(-50%, 0);
    }

    /* ==========================================================
       MOBILE
    ========================================================== */

    @media (max-width: 700px) {

      .topbar {
        height: 50px;

        padding: 0 15px;
      }

      .page {
        width:
          calc(100% - 30px);

        padding:
          63px
          0
          174px;
      }

      .empty-state h1 {
        font-size: 22px;
      }

      .empty-state p {
        max-width: 390px;

        font-size: 12px;
      }

      .starter-grid {
        grid-template-columns: 1fr;

        width: 100%;

        margin-top: 24px;
      }

      .composer-area {
        padding:
          0 10px
          10px;
      }

      .composer {
        max-width: none;
      }

      .toolbar {
        padding: 0 7px;
      }

      #model {
        width: 135px;
      }

      .send {
        padding: 0 9px;
      }

      .send span {
        display: none;
      }
    }

    @media (max-width: 440px) {

      .rpm {
        display: none;
      }

      .page {
        width:
          calc(100% - 22px);

        padding-top: 52px;
      }

      .message.user {
        padding-left: 12px;
      }

      #model {
        width: 122px;
      }
    }

    /* ==========================================================
       REDUCED MOTION
    ========================================================== */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .001ms !important;
        transition-duration: .001ms !important;
      }

      main {
        scroll-behavior: auto;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header class="topbar">

    <div class="topbar-title">
      Model Playground
    </div>

    <div class="topbar-spacer"></div>

    <div
      id="rpm"
      class="rpm">

      <span class="rpm-dot"></span>

      <span id="rpmText">
        10 / 10 left
      </span>

    </div>

  </header>


  <main id="log">

    <div class="page">

      <!-- EMPTY STATE -->

      <section
        id="emptyState"
        class="empty-state">

        <div class="empty-icon">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5">

            <rect
              x="5"
              y="5"
              width="14"
              height="14"
              rx="1"/>

            <path d="M9 12h6"/>
            <path d="M12 9v6"/>

          </svg>

        </div>


        <h1>
          Start a playground chat
        </h1>


        <p>
          Test a model with a starter prompt, or write your own request below.
        </p>


        <div class="starter-grid">

          <button
            class="starter"
            data-prompt="Analyze this data and explain the most important insights.">

            <svg
              class="starter-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6">

              <path d="M5 19V9"/>
              <path d="M10 19V5"/>
              <path d="M15 19v-7"/>
              <path d="M20 19V3"/>

            </svg>

            <span>
              Analyze data
            </span>

          </button>


          <button
            class="starter"
            data-prompt="Summarize the following text clearly and explain the important points.">

            <svg
              class="starter-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5">

              <rect
                x="5"
                y="4"
                width="14"
                height="17"
                rx="1"/>

              <path d="M8 8h8"/>
              <path d="M8 12h8"/>
              <path d="M8 16h5"/>

            </svg>

            <span>
              Summarize text
            </span>

          </button>


          <button
            class="starter"
            data-prompt="Help me write clean, production-ready code for this problem:">

            <svg
              class="starter-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6">

              <path d="m9 8-4 4 4 4"/>
              <path d="m15 8 4 4-4 4"/>
              <path d="m14 5-4 14"/>

            </svg>

            <span>
              Code
            </span>

          </button>


          <button
            class="starter"
            data-prompt="Give me practical advice about this situation:">

            <svg
              class="starter-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5">

              <path d="M7 9a5 5 0 0 1 10 0c0 2-1 3-2 4-.8.8-1 1.5-1 2.5h-4c0-1-.2-1.7-1-2.5-1-1-2-2-2-4Z"/>

              <path d="M9 20h6"/>
              <path d="M10 17h4"/>

            </svg>

            <span>
              Get advice
            </span>

          </button>

        </div>

      </section>


      <!-- MESSAGES -->

      <section
        id="messages"
        class="messages">
      </section>

    </div>

  </main>


  <!-- COMPOSER -->

  <div class="composer-area">

    <div class="composer-wrap">

      <form id="f">

        <div class="composer">

          <div class="input-area">

            <textarea
              id="input"
              rows="1"
              autocomplete="off"
              spellcheck="true"
              placeholder="Ask anything"
              aria-label="Message"></textarea>

          </div>


          <div class="toolbar">

            <div class="toolbar-left">

              <button
                class="tool-button"
                id="attachButton"
                type="button"
                title="Attach">

                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6">

                  <path
                    d="m20 11.5-8.5 8.5a5 5 0 0 1-7-7l9-9a3.5 3.5 0 0 1 5 5l-9 9a2 2 0 0 1-3-3l8-8"/>

                </svg>

              </button>


              <button
                class="tool-button"
                id="webButton"
                type="button"
                title="Web">

                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5">

                  <circle
                    cx="12"
                    cy="12"
                    r="8.5"/>

                  <path d="M3.5 12h17"/>

                  <path
                    d="M12 3.5c2.2 2.4 3.2 5.2 3.2 8.5S14.2 18.1 12 20.5"/>

                  <path
                    d="M12 3.5c-2.2 2.4-3.2 5.2-3.2 8.5s1 6.1 3.2 8.5"/>

                </svg>

              </button>


              <button
                class="tool-button"
                id="optionsButton"
                type="button"
                title="Options">

                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5">

                  <path d="M4 7h10"/>
                  <path d="M18 7h2"/>

                  <path d="M4 12h2"/>
                  <path d="M10 12h10"/>

                  <path d="M4 17h10"/>
                  <path d="M18 17h2"/>

                  <circle
                    cx="16"
                    cy="7"
                    r="1.5"/>

                  <circle
                    cx="8"
                    cy="12"
                    r="1.5"/>

                  <circle
                    cx="16"
                    cy="17"
                    r="1.5"/>

                </svg>

              </button>


              <div class="tool-divider"></div>


              <button
                class="tool-button"
                id="clearButton"
                type="button"
                title="Clear">

                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5">

                  <path d="M6 7h12"/>
                  <path d="M9 7V5h6v2"/>
                  <path d="m8 7 .7 12h6.6L16 7"/>

                  <path d="M10 10v6"/>
                  <path d="M14 10v6"/>

                </svg>

              </button>

            </div>


            <div class="toolbar-right">

              <div class="model-control">

                <svg
                  class="model-icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5">

                  <circle
                    cx="12"
                    cy="12"
                    r="7.5"/>

                  <path d="M12 4.5v15"/>
                  <path d="M4.5 12h15"/>

                </svg>


                <select
                  id="model"
                  aria-label="Model">

                  <option>
                    Loading…
                  </option>

                </select>


                <svg
                  class="model-arrow"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7">

                  <path d="m7 10 5 5 5-5"/>

                </svg>

              </div>


              <button
                class="send"
                id="send"
                type="submit">

                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7">

                  <path d="m4 12 16-8-5 16-3-7-8-1Z"/>
                  <path d="m12 13 3-3"/>

                </svg>

                <span>
                  Send
                </span>

              </button>

            </div>

          </div>

        </div>

      </form>

    </div>

  </div>

</div>


<div id="turnstile-box"></div>

<div
  id="toast"
  class="toast">
</div>


<script>
(() => {
  'use strict';

  /* ==========================================================
     CONFIG
  ========================================================== */

  // Same-origin in production: the Worker serves this page AND the API
  // on chat.latency.cyou. localhost dev hits the local wrangler dev worker.
  const API =
    (
      location.hostname === 'localhost' ||
      location.hostname === '127.0.0.1'
    )
      ? 'http://localhost:8787'
      : '';

  // Your Turnstile widget sitekey (dash.cloudflare.com → Turnstile → playground).
  const TURNSTILE_SITEKEY =
    '0x4AAAAAAEfWe-UOt9lYfMGB';

  /* ==========================================================
     SESSION
  ========================================================== */

  const SESSION_KEY =
    'pg.session';

  let session =
    localStorage.getItem(
      SESSION_KEY
    );

  if (!session) {

    session =
      crypto.randomUUID();

    localStorage.setItem(
      SESSION_KEY,
      session
    );
  }

  /* ==========================================================
     DOM
  ========================================================== */

  const $log =
    document.getElementById(
      'log'
    );

  const $messages =
    document.getElementById(
      'messages'
    );

  const $empty =
    document.getElementById(
      'emptyState'
    );

  const $model =
    document.getElementById(
      'model'
    );

  const $input =
    document.getElementById(
      'input'
    );

  const $send =
    document.getElementById(
      'send'
    );

  const $form =
    document.getElementById(
      'f'
    );

  const $rpm =
    document.getElementById(
      'rpm'
    );

  const $rpmText =
    document.getElementById(
      'rpmText'
    );

  const $toast =
    document.getElementById(
      'toast'
    );

  /* ==========================================================
     STATE
  ========================================================== */

  const MAX_RPM = 10;

  let used = 0;

  let windowEnd = 0;

  let busy = false;

  const history = [];

  /* ==========================================================
     TOAST
  ========================================================== */

  let toastTimer = null;

  function toast(message) {

    $toast.textContent =
      message;

    $toast.classList.add(
      'show'
    );

    clearTimeout(
      toastTimer
    );

    toastTimer =
      setTimeout(
        () => {

          $toast.classList.remove(
            'show'
          );

        },
        2200
      );
  }

  /* ==========================================================
     TURNSTILE
  ========================================================== */

  let tsToken = null;

  let tsWidget = null;

  function renderTurnstile() {

    if (
      typeof turnstile ===
      'undefined'
    ) {

      setTimeout(
        renderTurnstile,
        250
      );

      return;
    }

    // api.js is loaded with async+defer, so turnstile.ready() would throw.
    // Explicit render() is the supported path here (fires via onload hook too).
    tsWidget =
      turnstile.render(
        '#turnstile-box',
        {

          sitekey:
            TURNSTILE_SITEKEY,

          theme:
            'dark',

          size:
            'compact',

          appearance:
            'interaction-only',

          execution:
            'render',

          callback:
            token => {
              tsToken = token;
            },

          'expired-callback':
            () => {

              tsToken = null;

              if (
                tsWidget !==
                null
              ) {

                turnstile.reset(
                  tsWidget
                );
              }
            },

          'error-callback':
            () => {

              tsToken = null;

              if (
                tsWidget !==
                null
              ) {

                turnstile.reset(
                  tsWidget
                );
              }
            }

        }
      );
  }

  // api.js calls this global once it is ready (see onload= in the script tag).
  window.onTurnstileLoad = renderTurnstile;

  renderTurnstile();

  function waitForToken(
    timeout = 4000
  ) {

    const start =
      Date.now();

    return new Promise(
      resolve => {

        function check() {

          if (tsToken) {

            resolve(
              tsToken
            );

            return;
          }

          if (
            Date.now() - start >
            timeout
          ) {

            resolve(null);

            return;
          }

          setTimeout(
            check,
            100
          );
        }

        check();
      }
    );
  }

  function refreshTurnstile() {

    tsToken = null;

    if (
      tsWidget !== null &&
      typeof turnstile !==
        'undefined'
    ) {

      turnstile.reset(
        tsWidget
      );
    }
  }

  /* ==========================================================
     RATE LIMIT
  ========================================================== */

  function tickRpm() {

    const now =
      Date.now();

    if (
      now >= windowEnd
    ) {

      used = 0;

      windowEnd =
        now + 60000;
    }

    const left =
      Math.max(
        0,
        MAX_RPM - used
      );

    $rpmText.textContent =
      `${left} / ${MAX_RPM} left`;

    $rpm.classList.toggle(
      'warn',
      left <= 2
    );
  }

  tickRpm();

  setInterval(
    tickRpm,
    1000
  );

  /* ==========================================================
     MODELS
     Every /v1/* call is Turnstile-gated server-side, so the
     models fetch carries a token too and retries once if the
     widget was still warming up.
  ========================================================== */

  async function fetchModels() {

    for (let attempt = 0; attempt < 3; attempt++) {

      const token =
        await waitForToken(attempt === 0 ? 5000 : 8000);

      const headers = {
        'X-Session':
          session
      };

      if (token) {

        headers['X-Turnstile'] =
          token;
      }

      const response =
        await fetch(
          API + '/v1/models',
          { headers }
        );

      if (response.ok) {

        return response.json();
      }

      let code =
        '';

      try {

        code =
          (await response.json())?.error?.code ||
          '';

      } catch {}

      if (
        (
          code === 'missing_turnstile' ||
          code === 'bad_turnstile'
        ) &&
        attempt < 2
      ) {

        refreshTurnstile();

        await new Promise(
          r => setTimeout(r, 1200)
        );

        continue;
      }

      throw new Error(
        `HTTP ${response.status}`
      );
    }
  }

  async function loadModels() {

    $model.innerHTML =
      '<option>Loading…</option>';

    try {

      const data =
        await fetchModels();

      const ids =
        (data.data || [])
          .map(
            model =>
              model.id
          )
          .filter(Boolean)
          .sort();

      $model.innerHTML =
        '';

      for (
        const id of ids
      ) {

        const option =
          document.createElement(
            'option'
          );

        option.value =
          id;

        option.textContent =
          id;

        $model.appendChild(
          option
        );
      }

      if (!ids.length) {

        $model.innerHTML =
          '<option>No models available</option>';
      }

      // The token spent on /v1/models is single-use — reset the widget so
      // the first chat send gets a fresh one instead of a 403 bad_turnstile.
      refreshTurnstile();

    } catch (error) {

      console.error(error);

      $model.innerHTML =
        '<option>Failed to load models</option>';

      toast(
        'Could not load models'
      );
    }
  }

  loadModels();

  /* ==========================================================
     INPUT
  ========================================================== */

  function resizeInput() {

    $input.style.height =
      'auto';

    $input.style.height =
      Math.min(
        $input.scrollHeight,
        180
      ) + 'px';
  }

  $input.addEventListener(
    'input',
    resizeInput
  );

  $input.addEventListener(
    'keydown',
    event => {

      if (
        event.key === 'Enter' &&
        !event.shiftKey
      ) {

        event.preventDefault();

        $form.requestSubmit();
      }
    }
  );

  /* ==========================================================
     STARTERS
  ========================================================== */

  document
    .querySelectorAll(
      '.starter'
    )
    .forEach(
      button => {

        button.addEventListener(
          'click',
          () => {

            $input.value =
              button.dataset.prompt ||
              '';

            resizeInput();

            $input.focus();
          }
        );

      }
    );

  /* ==========================================================
     MESSAGES
  ========================================================== */

  function createMessage(
    role,
    text = ''
  ) {

    $empty.classList.add(
      'hidden'
    );

    const article =
      document.createElement(
        'article'
      );

    article.className =
      `message ${role}`;

    const roleElement =
      document.createElement(
        'div'
      );

    roleElement.className =
      'message-role';

    roleElement.textContent =
      role === 'user'
        ? 'You'
        : role === 'error'
          ? 'Error'
          : 'Assistant';

    const body =
      document.createElement(
        'div'
      );

    body.className =
      'message-body';

    body.textContent =
      text;

    article.appendChild(
      roleElement
    );

    article.appendChild(
      body
    );

    $messages.appendChild(
      article
    );

    scrollBottom();

    return {
      article,
      body
    };
  }

  /* ==========================================================
     SCROLL
  ========================================================== */

  function scrollBottom() {

    requestAnimationFrame(
      () => {

        $log.scrollTo({
          top:
            $log.scrollHeight,

          behavior:
            'smooth'
        });

      }
    );
  }

  /* ==========================================================
     CLEAR
  ========================================================== */

  document
    .getElementById(
      'clearButton'
    )
    .addEventListener(
      'click',
      () => {

        if (busy) {
          return;
        }

        history.length = 0;

        $messages.innerHTML =
          '';

        $empty.classList.remove(
          'hidden'
        );

        $input.value =
          '';

        resizeInput();

        $input.focus();

        toast(
          'Conversation cleared'
        );
      }
    );

  /* ==========================================================
     OTHER TOOL BUTTONS
  ========================================================== */

  document
    .getElementById(
      'attachButton'
    )
    .addEventListener(
      'click',
      () => {

        toast(
          'Attachments are not enabled'
        );
      }
    );

  document
    .getElementById(
      'webButton'
    )
    .addEventListener(
      'click',
      () => {

        toast(
          'Web search is not enabled'
        );
      }
    );

  document
    .getElementById(
      'optionsButton'
    )
    .addEventListener(
      'click',
      () => {

        toast(
          'No additional options'
        );
      }
    );

  /* ==========================================================
     SEND
  ========================================================== */

  $form.addEventListener(
    'submit',
    async event => {

      event.preventDefault();

      if (busy) {
        return;
      }

      const text =
        $input.value.trim();

      const model =
        $model.value;

      if (!text) {
        return;
      }

      if (
        !model ||
        model.includes('Failed') ||
        model.includes('available')
      ) {

        toast(
          'Select a model first'
        );

        return;
      }

      busy = true;

      $send.disabled =
        true;

      $input.value =
        '';

      resizeInput();

      createMessage(
        'user',
        text
      );

      history.push({
        role:
          'user',

        content:
          text
      });

      const target =
        createMessage(
          'assistant'
        );

      target.article.classList.add(
        'cursor'
      );

      let accumulated =
        '';

      try {

        const token =
          await waitForToken();

        const headers = {
          'Content-Type':
            'application/json',

          'X-Session':
            session
        };

        if (token) {

          headers[
            'X-Turnstile'
          ] = token;
        }

        const response =
          await fetch(
            API +
              '/v1/chat/completions',
            {
              method:
                'POST',

              headers,

              body:
                JSON.stringify({
                  model,
                  messages:
                    [...history],
                  stream:
                    true
                })
            }
          );

        refreshTurnstile();

        used += 1;

        tickRpm();

        if (!response.ok) {

          let message =
            `HTTP ${response.status}`;

          let code =
            '';

          try {

            const data =
              await response.json();

            message =
              data.error?.message ||
              message;

            code =
              data.error?.code ||
              '';

          } catch {}

          if (
            code ===
              'missing_turnstile' ||
            code ===
              'bad_turnstile'
          ) {

            message +=
              ' — security check refreshed, try again.';
          }

          target.article.className =
            'message error';

          target.article
            .querySelector(
              '.message-role'
            )
            .textContent =
            'Error';

          target.body.textContent =
            message;

          history.pop();

          toast(
            'Request failed'
          );

          return;
        }

        const contentType =
          response.headers.get(
            'content-type'
          ) || '';

        if (
          contentType.includes(
            'text/event-stream'
          )
        ) {

          const reader =
            response.body.getReader();

          const decoder =
            new TextDecoder();

          let buffer =
            '';

          while (true) {

            const {
              done,
              value
            } =
              await reader.read();

            if (done) {
              break;
            }

            buffer +=
              decoder.decode(
                value,
                {
                  stream:
                    true
                }
              );

            const lines =
              buffer.split(
                '\n'
              );

            buffer =
              lines.pop();

            for (
              const line of lines
            ) {

              const trimmed =
                line.trim();

              if (
                !trimmed.startsWith(
                  'data:'
                )
              ) {
                continue;
              }

              const payload =
                trimmed
                  .slice(5)
                  .trim();

              if (
                payload ===
                '[DONE]'
              ) {
                continue;
              }

              try {

                const data =
                  JSON.parse(
                    payload
                  );

                const delta =
                  data
                    .choices?.[0]
                    ?.delta
                    ?.content;

                if (delta) {

                  accumulated +=
                    delta;

                  target.body.textContent =
                    accumulated;

                  scrollBottom();
                }

              } catch {
                // Ignore malformed SSE chunks.
              }

            }
          }

          if (!accumulated) {

            accumulated =
              '(empty response)';

            target.body.textContent =
              accumulated;
          }

          history.push({
            role:
              'assistant',

            content:
              accumulated
          });

        } else {

          const data =
            await response.json();

          accumulated =
            data
              .choices?.[0]
              ?.message
              ?.content ||
            '(empty response)';

          target.body.textContent =
            accumulated;

          history.push({
            role:
              'assistant',

            content:
              accumulated
          });
        }

      } catch (error) {

        console.error(error);

        target.article.className =
          'message error';

        target.article
          .querySelector(
            '.message-role'
          )
          .textContent =
          'Error';

        target.body.textContent =
          'Network error — check your connection and try again.';

        history.pop();

        toast(
          'Network error'
        );

      } finally {

        target.article.classList.remove(
          'cursor'
        );

        busy = false;

        $send.disabled =
          false;

        $input.focus();
      }

    }
  );

  /* ==========================================================
     START
  ========================================================== */

  setTimeout(
    () => {
      $input.focus();
    },
    300
  );

})();
</script>

</body>
</html>
