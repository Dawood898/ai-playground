<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#181716">

  <link rel="preconnect" href="https://challenges.cloudflare.com">

  <!-- async+defer keeps the page non-blocking; render happens via onTurnstileLoad.
       turnstile.ready() refuses to run with async/defer, so we must use onload. -->
  <script
    src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onTurnstileLoad"
    async
    defer>
  </script>

  <style>
    :root {
      --bg: #181716;
      --panel: #242321;
      --panel-hover: #292725;

      --border: #373532;
      --border-hover: #45413d;

      --text: #e6e1da;
      --text-secondary: #aaa49c;
      --muted: #77716a;
      --muted-dark: #5d5954;

      --success: #789878;
      --warning: #b38d53;
      --danger: #b76a63;

      --content-width: 790px;
      --composer-width: 950px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;

      background: var(--bg);
      color: var(--text);

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      -webkit-font-smoothing: antialiased;
    }

    button,
    select,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
    }

    /* ==========================================================
       APP
    ========================================================== */

    .app {
      width: 100%;
      height: 100%;

      position: relative;

      display: flex;
      flex-direction: column;
    }

    /* ==========================================================
       TOP BAR
    ========================================================== */

    .topbar {
      height: 56px;
      flex-shrink: 0;

      display: flex;
      align-items: center;

      padding: 0 28px;

      border-bottom: 1px solid rgba(255,255,255,.025);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .topbar-title {
      color: #a49f98;

      font-size: 12px;
      font-weight: 500;

      text-decoration: none;

      transition: color .14s ease;
    }

    .topbar-title:hover {
      color: #d5d0c8;
    }

    .topbar-title::after {
      content: "↗";

      margin-left: 4px;

      font-size: 10px;

      color: #6f6962;
    }

    .topbar-spacer {
      flex: 1;
    }

    .rpm-clock {
      margin-left: 2px;

      color: var(--muted-dark);

      font-variant-numeric: tabular-nums;
    }

    .rpm {
      display: flex;
      align-items: center;
      gap: 7px;

      color: var(--muted);

      font-size: 11px;
    }

    .rpm-dot {
      width: 5px;
      height: 5px;

      border-radius: 50%;

      background: var(--success);
    }

    .rpm.warn {
      color: var(--warning);
    }

    .rpm.warn .rpm-dot {
      background: var(--warning);
    }

    /* ==========================================================
       MAIN
    ========================================================== */

    main {
      flex: 1;
      min-height: 0;

      overflow-y: auto;
      -webkit-overflow-scrolling: touch;

      overscroll-behavior: contain;

      scrollbar-width: thin;
      scrollbar-color: #34312e transparent;
    }

    .page {
      width: min(var(--content-width), calc(100% - 48px));

      margin: 0 auto;

      padding:
        92px
        0
        56px;
    }

    /* ==========================================================
       EMPTY STATE
    ========================================================== */

    .empty-state {
      width: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;
    }

    .empty-state.hidden {
      display: none;
    }

    .empty-icon {
      width: 36px;
      height: 36px;

      display: grid;
      place-items: center;

      margin-bottom: 19px;

      border: 1px solid var(--border);

      color: #8b857d;

      background: rgba(255,255,255,.006);
    }

    .empty-icon svg {
      width: 15px;
      height: 15px;
    }

    .empty-state h1 {
      margin: 0;

      color: #e3ded7;

      font-size: 24px;
      font-weight: 600;

      line-height: 1.15;

      letter-spacing: -.025em;
    }

    .empty-state p {
      max-width: 520px;

      margin: 10px 0 0;

      color: #918b84;

      font-size: 13px;

      line-height: 1.55;
    }

    /* ==========================================================
       STARTERS
    ========================================================== */

    .starter-grid {
      width: min(650px, 100%);

      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 8px;

      margin-top: 29px;
    }

    .starter {
      min-height: 39px;

      display: flex;
      align-items: center;

      gap: 9px;

      padding: 9px 11px;

      border: 1px solid var(--border);

      background: rgba(255,255,255,.006);

      color: #d5d0c8;

      text-align: left;

      cursor: pointer;

      transition:
        background .15s ease,
        border-color .15s ease;
    }

    .starter:hover {
      background: var(--panel-hover);
      border-color: var(--border-hover);
    }

    .starter-icon {
      width: 14px;
      height: 14px;

      flex-shrink: 0;

      color: #79736c;
    }

    .starter span {
      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;

      font-size: 12.5px;
    }

    /* ==========================================================
       MESSAGES
    ========================================================== */

    .messages {
      display: flex;
      flex-direction: column;

      gap: 31px;
    }

    .message {
      animation:
        messageIn .18s ease both;
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(3px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message-role {
      margin-bottom: 6px;

      color: var(--muted-dark);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      font-size: 9.5px;
      font-weight: 600;

      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .message-body {
      color: #cbc6bf;

      font-size: 14px;

      line-height: 1.72;

      white-space: pre-wrap;

      word-break: break-word;
    }

    .message.user {
      padding-left: 25px;
    }

    .message.user .message-body {
      color: #ded9d1;
    }

    .message.error {
      padding: 12px 14px;

      border: 1px solid rgba(183,106,99,.28);

      background: rgba(183,106,99,.055);
    }

    .message.error .message-role {
      color: var(--danger);
    }

    /* ==========================================================
       STREAMING CURSOR
    ========================================================== */

    .cursor .message-body::after {
      content: "▋";

      display: inline-block;

      margin-left: 2px;

      color: #aaa49c;

      animation:
        blink .9s steps(1) infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    /* ==========================================================
       CODE
    ========================================================== */

    .message-body code {
      padding: 2px 5px;

      border: 1px solid var(--border);

      background: #11100f;

      font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

      font-size: 12px;
    }

    .message-body pre {
      overflow-x: auto;

      margin: 14px 0;

      padding: 14px;

      border: 1px solid var(--border);

      background: #11100f;

      font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

      font-size: 12px;

      line-height: 1.65;
    }

    .message-body a {
      color: #d7d2cb;

      text-decoration: underline;

      text-underline-offset: 3px;
    }

    /* ==========================================================
       MARKDOWN (rendered assistant messages)
    ========================================================== */

    /* Assistant output is Markdown-rendered; keep its block layout clean.
       User messages stay pre-wrapped so the visitor sees their exact text. */
    .message.assistant .message-body {
      white-space: normal;
    }

    .message-body h1,
    .message-body h2,
    .message-body h3,
    .message-body h4,
    .message-body h5,
    .message-body h6 {
      margin: 18px 0 8px;

      color: #e3ded7;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      font-weight: 600;

      line-height: 1.3;

      letter-spacing: -.01em;
    }

    .message-body h1 {
      font-size: 19px;
    }

    .message-body h2 {
      font-size: 17px;
    }

    .message-body h3 {
      font-size: 15px;
    }

    .message-body h4,
    .message-body h5,
    .message-body h6 {
      font-size: 14px;
    }

    .message-body p {
      margin: 10px 0;
    }

    .message-body ul,
    .message-body ol {
      margin: 10px 0;

      padding-left: 22px;
    }

    .message-body li {
      margin: 3px 0;
    }

    .message-body blockquote {
      margin: 10px 0;

      padding: 6px 12px;

      border-left: 3px solid var(--border);

      color: var(--text-secondary);

      background: rgba(255,255,255,.01);
    }

    .message-body hr {
      margin: 16px 0;

      border: 0;

      border-top: 1px solid var(--border);
    }

    .message-body strong {
      color: #efe9e0;

      font-weight: 700;
    }

    /* ==========================================================
       CODE BLOCKS + COPY BUTTON
    ========================================================== */

    .message-body .code-block {
      margin: 14px 0;

      border: 1px solid var(--border);

      background: #11100f;
    }

    .code-head {
      height: 32px;

      display: flex;
      align-items: center;

      padding: 0 10px;

      border-bottom: 1px solid var(--border);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .code-lang {
      color: var(--muted);

      font-size: 9.5px;
      font-weight: 600;

      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .copy-code {
      margin-left: auto;

      padding: 4px 9px;

      border: 1px solid var(--border);

      background: #1c1b19;

      color: #8f897f;

      cursor: pointer;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      font-size: 10px;

      transition:
        color .14s ease,
        background .14s ease,
        border-color .14s ease;
    }

    .copy-code:hover {
      color: #cfc9c0;

      background: #262421;

      border-color: var(--border-hover);
    }

    .copy-code.copied {
      color: var(--success);

      border-color: rgba(120,152,120,.4);
    }

    .message-body .code-block pre {
      margin: 0;

      border: 0;

      border-radius: 0;
    }

    .message-body .code-block pre code {
      display: block;

      padding: 14px;

      border: 0;

      border-radius: 0;

      background: transparent;
    }

    /* ==========================================================
       REGENERATE
    ========================================================== */

    .regenerate {
      display: inline-flex;
      align-items: center;

      gap: 6px;

      margin-top: 10px;

      padding: 5px 9px;

      border: 1px solid transparent;

      background: transparent;

      color: var(--muted);

      cursor: pointer;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      font-size: 10.5px;

      transition:
        color .14s ease,
        border-color .14s ease,
        background .14s ease;
    }

    .regenerate:hover {
      color: #cfc9c0;

      background: rgba(255,255,255,.025);
    }

    .regenerate:disabled {
      opacity: .4;

      cursor: not-allowed;
    }

    .regenerate svg {
      width: 13px;
      height: 13px;
    }

    /* ==========================================================
       COMPOSER BACKDROP
    ========================================================== */

    .composer-area {
      flex-shrink: 0;

      display: flex;
      justify-content: center;

      padding:
        0 24px
        14px;
    }

    .composer-wrap {
      width: min(
        var(--composer-width),
        100%
      );
    }

    /* ==========================================================
       COMPOSER
    ========================================================== */

    .composer {
      width: 100%;

      border: 1px solid var(--border);

      background: var(--panel);

      box-shadow:
        0 9px 32px rgba(0,0,0,.12);
    }

    .input-area {
      min-height: 86px;
    }

    textarea {
      width: 100%;

      min-height: 86px;
      max-height: 180px;

      display: block;

      resize: none;

      padding:
        15px 18px
        10px;

      border: 0;
      outline: 0;

      background: transparent;

      color: #ddd8d1;

      font-size: 14px;

      line-height: 1.6;
    }

    textarea::placeholder {
      color: #6e6963;
    }

    /* ==========================================================
       TOOLBAR
    ========================================================== */

    .toolbar {
      height: 50px;

      display: flex;
      align-items: center;

      padding: 0 10px;

      border-top: 1px solid var(--border);
    }

    .toolbar-left,
    .toolbar-right {
      display: flex;
      align-items: center;
    }

    .toolbar-left {
      gap: 2px;
    }

    .toolbar-right {
      margin-left: auto;

      gap: 6px;
    }

    .tool-button {
      width: 30px;
      height: 30px;

      display: grid;
      place-items: center;

      background: transparent;

      color: #6f6962;

      cursor: pointer;

      transition:
        color .14s ease,
        background .14s ease;
    }

    .tool-button:hover {
      color: #9c968e;

      background: #2b2926;
    }

    .tool-button svg {
      width: 15px;
      height: 15px;
    }

    .tool-divider {
      width: 1px;
      height: 18px;

      margin: 0 4px;

      background: var(--border);
    }

    /* ==========================================================
       MODEL
    ========================================================== */

    .model-control {
      position: relative;

      display: flex;
      align-items: center;
    }

    .model-control .model-icon {
      position: absolute;

      left: 10px;

      width: 12px;
      height: 12px;

      color: #7a746d;

      pointer-events: none;

      z-index: 2;
    }

    #model {
      appearance: none;
      -webkit-appearance: none;

      width: 170px;
      height: 32px;

      padding:
        0 27px
        0 30px;

      border: 1px solid var(--border);

      background: #282623;

      color: #bdb7af;

      outline: none;

      cursor: pointer;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      font-size: 10.5px;
    }

    #model:hover {
      background: #2c2926;

      border-color: var(--border-hover);
    }

    #model option {
      background: #242220;

      color: #ddd8d0;
    }

    .model-arrow {
      position: absolute;

      right: 8px;

      width: 11px;
      height: 11px;

      color: #67615b;

      pointer-events: none;
    }

    /* ==========================================================
       SEND
    ========================================================== */

    .send {
      height: 32px;

      display: flex;
      align-items: center;

      gap: 6px;

      padding: 0 11px;

      border: 1px solid var(--border);

      background: #292724;

      color: #79736d;

      cursor: pointer;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      font-size: 10.5px;

      transition:
        background .14s ease,
        color .14s ease,
        border-color .14s ease;
    }

    .send:hover:not(:disabled) {
      color: #b5afa7;

      background: #302d2a;

      border-color: var(--border-hover);
    }

    .send:disabled {
      opacity: .4;

      cursor: not-allowed;
    }

    .send svg {
      width: 13px;
      height: 13px;
    }

    /* Stop state: the send button turns into a red stop button while a
       request is in flight. Hidden icons/label swap via this class. */
    .send .icon-stop,
    .send.stop .icon-send {
      display: none;
    }

    .send.stop {
      color: #e0b3ae;

      background: #3a2523;

      border-color: rgba(183,106,99,.42);
    }

    .send.stop:hover:not(:disabled) {
      color: #f1c9c4;

      background: #44292a;

      border-color: rgba(183,106,99,.6);
    }

    .send.stop .icon-stop {
      display: block;
    }

    /* ==========================================================
       TURNSTILE
       Rendered with appearance:'interaction-only', so the widget is hidden
       by default (only appearing if Turnstile actually needs to challenge the
       visitor) — it never overlaps the page. Managed mode mints a token once
       per page load, and the Worker keeps a per-session grant, so the widget
       is not reset on pageshow / tab focus or after each API call. If the
       grant lapses, the submit handler refreshes the widget and re-verifies.
    ========================================================== */

    #turnstile-box {
      position: fixed;

      left: 14px;
      bottom: 14px;

      z-index: 60;
    }

    /* ==========================================================
       TOAST
    ========================================================== */

    .toast {
      position: fixed;

      left: 50%;
      bottom: 155px;

      transform:
        translate(-50%, 8px);

      padding:
        7px 11px;

      border: 1px solid var(--border);

      background: #292724;

      color: #c5bfb7;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      font-size: 10.5px;

      opacity: 0;

      pointer-events: none;

      transition:
        opacity .18s ease,
        transform .18s ease;

      z-index: 50;
    }

    .toast.show {
      opacity: 1;

      transform:
        translate(-50%, 0);
    }

    /* ==========================================================
       MESSAGE STATS (per-message TTFT + tokens/s)
       Rendered inside each assistant bubble so the values persist
       after the stream finishes, unlike the old single live bar.
    ========================================================== */

    .message-stats {
      display: flex;
      align-items: center;

      gap: 18px;

      margin-top: 8px;

      color: var(--muted-dark);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      font-size: 11px;

      letter-spacing: .02em;
    }

    .message-stats:empty {
      display: none;
    }

    .message-stats.hidden {
      display: none;
    }

    .stat {
      display: flex;
      align-items: baseline;

      gap: 6px;
    }

    .stat-label {
      color: var(--muted);

      font-size: 9.5px;

      font-weight: 600;

      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .stat-value {
      color: #c5bfb7;

      font-variant-numeric: tabular-nums;
    }

    /* ==========================================================
       BRAND FOOTER
    ========================================================== */

    .brand-footer {
      flex-shrink: 0;

      display: flex;
      justify-content: center;

      gap: 5px;

      padding: 0 24px 14px;

      color: var(--muted-dark);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      font-size: 10.5px;

      letter-spacing: .01em;

      text-align: center;
    }

    .brand-footer a {
      color: #a49f98;

      text-decoration: underline;

      text-underline-offset: 2px;

      transition: color .14s ease;
    }

    .brand-footer a:hover {
      color: #d5d0c8;
    }

    .brand-heart {
      color: var(--danger);
    }

    /* ==========================================================
       MOBILE
    ========================================================== */

    @media (max-width: 700px) {

      .topbar {
        height: 50px;

        padding: 0 15px;
      }

      .page {
        width:
          calc(100% - 30px);

        padding:
          63px
          0
          44px;
      }

      .empty-state h1 {
        font-size: 22px;
      }

      .empty-state p {
        max-width: 390px;

        font-size: 12px;
      }

      .starter-grid {
        grid-template-columns: 1fr;

        width: 100%;

        margin-top: 24px;
      }

      .composer-area {
        padding:
          0 10px
          10px;
      }

      .composer {
        max-width: none;
      }

      .toolbar {
        padding: 0 7px;
      }

      #model {
        width: 135px;
      }

      .send {
        padding: 0 9px;
      }

      .send-label {
        display: none;
      }

      .brand-footer {
        padding-bottom: 10px;
      }
    }

    @media (max-width: 440px) {

      .rpm {
        display: none;
      }

      .page {
        width:
          calc(100% - 22px);

        padding-top: 52px;
      }

      .message.user {
        padding-left: 12px;
      }

      #model {
        width: 122px;
      }
    }

    /* ==========================================================
       REDUCED MOTION
    ========================================================== */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .001ms !important;
        transition-duration: .001ms !important;
      }

      main {
        scroll-behavior: auto;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header class="topbar">

    <a
      class="topbar-title"
      href="https://latency.cyou/"
      title="Back to latency.cyou">
      Model Playground
    </a>

    <div class="topbar-spacer"></div>

    <div
      id="rpm"
      class="rpm">

      <span class="rpm-dot"></span>

      <span id="rpmText">
        10 / 10 left
      </span>

      <span
        id="rpmClock"
        class="rpm-clock"></span>

    </div>

  </header>


  <main id="log">

    <div class="page">

      <!-- EMPTY STATE -->

      <section
        id="emptyState"
        class="empty-state">

        <div class="empty-icon">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5">

            <rect
              x="5"
              y="5"
              width="14"
              height="14"
              rx="1"/>

            <path d="M9 12h6"/>
            <path d="M12 9v6"/>

          </svg>

        </div>


        <h1>
          Start a playground chat
        </h1>


        <p>
          Test a model with a starter prompt, or write your own request below.
        </p>


        <div class="starter-grid">

          <button
            class="starter"
            data-prompt="Analyze this data and explain the most important insights.">

            <svg
              class="starter-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6">

              <path d="M5 19V9"/>
              <path d="M10 19V5"/>

<script>
(() => {
  'use strict';

  /* ==========================================================
     CONFIG
  ========================================================== */

  // Same-origin in production: the Worker serves this page AND the API
  // on chat.latency.cyou. localhost dev hits the local wrangler dev worker.
  const API =
    (
      location.hostname === 'localhost' ||
      location.hostname === '127.0.0.1'

      : '';

  // Your Turnstile widget sitekey (dash.cloudflare.com → Turnstile → playground).
  const TURNSTILE_SITEKEY =
    '0x4AAAAAAEfWe-UOt9lYfMGB';

  /* ==========================================================
     SESSION
  ========================================================== */

  const SESSION_KEY =
    'pg.session';

  let session =
    localStorage.getItem(
      SESSION_KEY
    );

  if (!session) {

    session =
      crypto.randomUUID();

    localStorage.setItem(
      SESSION_KEY,
      session

  }

  /* ==========================================================
     DOM
  ========================================================== */

  const $log =
    document.getElementById(
      'log'
    );

  const $toast =
    document.getElementById(
      'toast'
    );

  /* ==========================================================
     STATE
  ========================================================== */

  const MAX_RPM = 10;

  let used = 0;

  let windowEnd = 0;

  let busy = false;

  let activeController = null;

  // True once the Worker has accepted our Turnstile pass for this session. The
  // Worker stores a short-lived grant, so on later requests we can omit the
  // token and stop resetting the widget on every message.
  let sessionVerified = false;

  const history = [];

  /* ==========================================================
     TOAST
  ========================================================== */

  let toastTimer = null;

  function toast(message) {

    $toast.textContent =
      message;

    $toast.classList.add(
      'show'
    );

    clearTimeout(
      toastTimer
    );

    toastTimer =
      setTimeout(
        () => {

          $toast.classList.remove(
            'show'
          );

        },
        2200
      );
  }

  /* ==========================================================
     TURNSTILE
  ========================================================== */

  let tsToken = null;

  let tsWidget = null;

  function renderTurnstile() {

    if (
      typeof turnstile ===
      'undefined'
    ) {

      setTimeout(
        renderTurnstile,
        250
      );

      return;
    }

    // api.js is loaded with async+defer, so turnstile.ready() would throw.
    // Explicit render() is the supported path here (fires via onload hook too).
    // appearance:'interaction-only' hides the widget so it never overlaps the
    // page; it only appears if Turnstile actually needs to challenge the
    // visitor. Managed mode mints a token once per page load, and the Worker
    // now remembers the session as "verified" (short-lived grant), so the
    // widget is NOT reset on every request — the visitor passes the human
    // check once per refresh, not per message.
    tsWidget =
      turnstile.render(
        '#turnstile-box',
        {

          sitekey:
            TURNSTILE_SITEKEY,

          theme:
            'dark',

          size:
            'compact',

          appearance:
            'interaction-only',

          execution:
            'render',

          callback:
            token => {
              tsToken = token;
            },

          'expired-callback':
            () => {

              tsToken = null;

              if (
                tsWidget !==
                null
              ) {

                turnstile.reset(
                  tsWidget
                );
              }
            },

          'error-callback':
            () => {

              tsToken = null;

              if (
                tsWidget !==
                null
              ) {

                turnstile.reset(
                  tsWidget
                );
              }
            }

        }
      );
  }

  // api.js calls this global once it is ready (see onload= in the script tag).
  window.onTurnstileLoad = renderTurnstile;

  renderTurnstile();

  function waitForToken(
    timeout = 4000
  ) {

    const start =
      Date.now();

    return new Promise(
      resolve => {

        function check() {

          if (tsToken) {

            resolve(
              tsToken
            );

            return;
          }

          if (
            Date.now() - start >
            timeout
          ) {

            resolve(null);

            return;
          }

          setTimeout(
            check,
            100
          );
        }

        check();
      }
    );
  }

  function refreshTurnstile() {

    tsToken = null;

    if (
      tsWidget !== null &&
      typeof turnstile !==
        'undefined'
    ) {

      turnstile.reset(
        tsWidget
      );
    }
  }

  /* ==========================================================
     RATE LIMIT
     Server rate-limits each session to MAX_RPM requests per
     rolling 60s window (tracked per IP AND per session). The
     page only knows how many it has made, so it shows a local
     countdown that starts fresh on every page load and ticks
     down to the next local window. The server window resets on
     its own; this is a friendly estimate, not the authority.
  ========================================================== */

  function fmtClock(seconds) {

    const m =
      Math.floor(
        seconds / 60
      );

    const s =
      seconds % 60;

    return (
      `${m}:${s < 10 ? '0' : ''}${s}`
    );
  }

  function tickRpm() {

    const now =
      Date.now();

    if (
      now >= windowEnd
    ) {

      used = 0;

      windowEnd =
        now + 60000;
    }

    const left =
      Math.max(
        0,
        MAX_RPM - used
      );

    const remaining =
      Math.max(
        0,
        Math.ceil(
          (windowEnd - now) /
            1000
        )
      );

    $rpmText.textContent =
      `${left} / ${MAX_RPM} left`;

    $rpmClock.textContent =
      `· ${fmtClock(remaining)}`;

    $rpm.classList.toggle(
      'warn',
      left <= 2
    );
  }

  // Refresh reset: each page load starts a fresh 60s window, so the
  // countdown always begins at 60s and the full quota shows as unused.
  windowEnd =
    Date.now() + 60000;

  tickRpm();

  setInterval(
    tickRpm,
    1000
  );

  /* ==========================================================
     MODELS
     The first /v1/* call in a session carries the Turnstile token so the
     Worker can verify it and store a short-lived session grant. Once that
     succeeds we set sessionVerified and stop sending the token (and stop
     resetting the widget) on every request.
  ========================================================== */

  async function fetchModels() {

    for (let attempt = 0; attempt < 3; attempt++) {

      const token =
        sessionVerified
          ? null
          : await waitForToken(attempt === 0 ? 5000 : 8000);

      const headers = {
        'X-Session':
          session
      };

      if (token) {

        headers['X-Turnstile'] =
          token;
      }

      const response =
        await fetch(
          API + '/v1/models',
          { headers }
        );

      if (response.ok) {

        sessionVerified =
          true;

        return response.json();
      }

      let code =
        '';

      try {

        code =
          (await response.json())?.error?.code ||
          '';

      } catch {}

      if (
        (
          code === 'missing_turnstile' ||
          code === 'bad_turnstile'
        ) &&
        attempt < 2
      ) {

        // The grant lapsed (or the token was rejected): drop the verified flag
        // so the next attempt mints a fresh token instead of sending none.
        sessionVerified =
          false;

        refreshTurnstile();

        await new Promise(
          r => setTimeout(r, 1200)
        );

        continue;
      }

      throw new Error(
        `HTTP ${response.status}`
      );
    }
  }

  async function loadModels() {

    $model.innerHTML =
      '<option>Loading…</option>';

    try {

      const data =
        await fetchModels();

      const ids =
        (data.data || [])
          .map(
            model =>
              model.id
          )
          .filter(Boolean)
          .sort();

      $model.innerHTML =
        '';

      for (
        const id of ids
      ) {

        const option =
          document.createElement(
            'option'
          );

        option.value =
          id;

        option.textContent =
          id;

        $model.appendChild(
          option
        );
      }

      if (!ids.length) {

        $model.innerHTML =
          '<option>No models available</option>';
      }

    } catch (error) {

      console.error(error);

      $model.innerHTML =
        '<option>Failed to load models</option>';

      toast(
        'Could not load models'
      );
    }
  }

  loadModels();

  /* ==========================================================
     INPUT
  ========================================================== */

  function resizeInput() {

    $input.style.height =
      'auto';

    $input.style.height =
      Math.min(
        $input.scrollHeight,
        180
      ) + 'px';
  }

  $input.addEventListener(
    'input',
    resizeInput
  );

  $input.addEventListener(
    'keydown',
    event => {

      if (
        event.key === 'Enter' &&
        !event.shiftKey
      ) {

        event.preventDefault();

        $form.requestSubmit();
      }
    }
  );

  /* ==========================================================
     STARTERS
  ========================================================== */

  document
    .querySelectorAll(
      '.starter'
    )
    .forEach(
      button => {

        button.addEventListener(
          'click',
          () => {

            $input.value =
              button.dataset.prompt ||
              '';

            resizeInput();

            $input.focus();
          }
        );

      }
    );

  /* ==========================================================
     MESSAGES
  ========================================================== */


  /* ==========================================================
     MESSAGES
  ========================================================== */

  // Shown in place of any red-box error, so visitors never see the raw
  // server/network failure text.
  const ERROR_MESSAGE =
    'This model is not available for testing at https://chat.latency.cyou/';

  // One entry per send/regenerate turn, keyed by its turn index. Lets a
  // regenerate icon re-run just its own prompt and rewrite the reply without
  // disturbing earlier turns.
  const turns =
    [];

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/\"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // Inline markdown: `code`, **bold**, *italic*, _italic_, [link](url).
  // Runs on already-escaped text, so it can never emit raw HTML (no XSS).
  const BT = String.fromCharCode(96); // backtick

  function inlineMarkdown(text) {

    let result =
      String(text);

    result =
      result.replace(
        new RegExp(BT + '([^' + BT + ']+)' + BT, 'g'),
        '<code>$1</code>'
      );

    result =
      result.replace(
        /\*\*([^*]+)\*\*/g,
        '<strong>$1</strong>'
      );

    result =
      result.replace(
        /(^|[^*])\*([^*\n]+)\*/g,
        '$1<em>$2</em>'
      );

    result =
      result.replace(
        /_([^_\n]+)_/g,
        '<em>$1</em>'
      );

    result =
      result.replace(
        /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener">$1</a>'
      );

    return result;
  }

  function renderMarkdown(source) {

    if (!source) {
      return '';
    }

    const lines =
      String(source).split('\n');

    const out =
      [];

    let para =
      [];

    let list =
      null;

    const flushPara = () => {
      if (para.length) {
        out.push('<p>' + inlineMarkdown(para.join('<br/>')) + '</p>');
        para = [];
      }
    };

    const flushList = () => {
      if (list) {
        const tag = list.type === 'ol' ? 'ol' : 'ul';
        out.push('<' + tag + '>' + list.items.map(item => '<li>' + inlineMarkdown(item) + '</li>').join('') + '</' + tag + '>');
        list = null;
      }
    };

    const codeFence =
      new RegExp('^' + BT + BT + BT + '([a-zA-Z0-9+-]*)\\s*$');

    const closeFence =
      new RegExp('^' + BT + BT + BT + '\\s*$');

    for (let i = 0; i < lines.length; i++) {

      const line =
        lines[i];

      if (codeFence.test(line)) {

        flushPara();
        flushList();

        const lang =
          (line.match(codeFence) || [])[1] || '';

        const codeLines =
          [];

        i++;

        while (i < lines.length && !closeFence.test(lines[i])) {
          codeLines.push(lines[i]);
          i++;
        }

        out.push(
          '<div class="code-block">' +
            '<div class="code-head">' +
              '<span class="code-lang">' + escapeHtml(lang) + '</span>' +
              '<button class="copy-code" type="button" title="Copy code">Copy</button>' +
            '</div>' +
            '<pre><code>' + escapeHtml(codeLines.join('\n')) + '</code></pre>' +
          '</div>'
        );

        continue;
      }

      const heading =
        line.match(/^(#{1,6})\s+(.*)$/);

      if (heading) {

        flushPara();
        flushList();

        const level =
          heading[1].length;

        out.push('<h' + level + '>' + inlineMarkdown(heading[2]) + '</h' + level + '>');

        continue;
      }

      if (/^\s*(---|\*\*\*|___)\s*$/.test(line)) {
        flushPara();
        flushList();
        out.push('<hr/>');
        continue;
      }

      if (/^>\s?/.test(line)) {

        flushPara();
        flushList();

        const quote =
          [];

        while (i < lines.length && /^>\s?/.test(lines[i])) {
          quote.push(lines[i].replace(/^>\s?/, ''));
          i++;
        }

        i--;

        out.push('<blockquote>' + inlineMarkdown(quote.join('<br/>')) + '</blockquote>');

        continue;
      }

      const bullet =
        line.match(/^\s*[-*+]\s+(.*)$/);

      if (bullet) {
        flushPara();
        if (list && list.type !== 'ul') flushList();
        if (!list) list = { type: 'ul', items: [] };
        list.items.push(bullet[1]);
        continue;
      }

      const ordered =
        line.match(/^\s*\d+\.\s+(.*)$/);

      if (ordered) {
        flushPara();
        if (list && list.type !== 'ol') flushList();
        if (!list) list = { type: 'ol', items: [] };
        list.items.push(ordered[1]);
        continue;
      }

      if (/^\s*$/.test(line)) {
        flushPara();
        flushList();
        continue;
      }

      flushList();
      para.push(line);
    }

    flushPara();
    flushList();

    return out.join('');
  }

  function addRegenerateButton(article, turnIndex) {

    if (article.querySelector('.regenerate')) return;

    const button =
      document.createElement('button');

    button.className =

        '<path d="M20 12a8 8 0 1 1-2.34-5.66"/>' +

  function createMessage(
    role,
    text = ''
  ) {

    $empty.classList.add(

    );

    const article =

      );

    roleElement.textContent =

        ? 'You'
        : role === 'error'
          ? 'Error'
          : 'Assistant';

    const body =
      document.createElement(
        'div'
      );

    body.className =
      'message-body';

    body.textContent =
      text;

    article.appendChild(
      roleElement
    );

    article.appendChild(
      body
    );

    // Assistant messages carry their own TTFT + tokens/s row so the
    // values persist after the stream finishes.
    let stats = null;

    if (role === 'assistant') {

      stats =
        document.createElement(
          'div'
        );

      stats.className =
        'message-stats';

      const ttftStat =
        document.createElement(
          'span'
        );

      ttftStat.className =
        'stat';

      const ttftLabel =
        document.createElement(
          'span'
        );

      ttftLabel.className =
        'stat-label';

      ttftLabel.textContent =
        'TTFT';

      const ttftValue =
        document.createElement(
          'span'
        );

      ttftValue.className =
        'stat-value';

      ttftValue.textContent =
        '—';

      ttftStat.appendChild(
        ttftLabel
      );

      ttftStat.appendChild(
        ttftValue
      );

      const speedStat =
        document.createElement(
          'span'
        );

      speedStat.className =
        'stat';

      const speedLabel =
        document.createElement(
          'span'
        );

      speedLabel.className =
        'stat-label';

      speedLabel.textContent =
        'Speed';

      const speedValue =
        document.createElement(
          'span'
        );

      speedValue.className =
        'stat-value';

      speedValue.textContent =
        '—';

      speedStat.appendChild(
        speedLabel
      );

      speedStat.appendChild(
        speedValue
      );

      stats.appendChild(
        ttftStat
      );

      stats.appendChild(
        speedStat
      );

      stats.classList.add(
        'hidden'
      );

      article.appendChild(
        stats
      );
    }

    $messages.appendChild(
      article
    );

    scrollBottom();

    return {
      article,
      body,
      stats
    };
  }

  /* ==========================================================
     SCROLL
     Stick-to-bottom: while a stream is running we only auto-scroll if the
     visitor is already near the bottom. If they scroll up to read earlier
     text, we leave them alone (instead of yanking them back down on every
     chunk with behavior:'smooth'). Scrolling back down re-engages the
     auto-follow. This is what unblocks scrolling on mobile during a request.
  ========================================================== */

  const SCROLL_STICK_DISTANCE = 80;

  let stickBottom =
    true;

  $log.addEventListener(
    'scroll',
    () => {

      const distance =
        $log.scrollHeight -
        $log.scrollTop -
        $log.clientHeight;

      stickBottom =
        distance <=
        SCROLL_STICK_DISTANCE;
    },
    { passive: true }
  );

  function scrollBottom() {

    if (!stickBottom) {

      return;
    }

    requestAnimationFrame(
      () => {

        $log.scrollTop =
          $log.scrollHeight;
      }
    );
  }

  /* ==========================================================
     CLEAR
  ========================================================== */

  document
    .getElementById(
      'clearButton'
    )
    .addEventListener(
      'click',
      () => {

        if (busy) {
          return;
        }

        history.length = 0;

        turns.length = 0;

        $messages.innerHTML =
          '';

        $empty.classList.remove(
          'hidden'
        );

        $input.value =
          '';

        resizeInput();

        $input.focus();

        toast(
          'Conversation cleared'
        );
      }
    );

  /* ==========================================================
     SEND
     The send button doubles as a stop button while a request is
     in flight: clicking it aborts the fetch via AbortController.
     TTFT and live tokens/s are computed client-side from the SSE
     stream and written to the assistant message's own stats row,
     where they persist after the stream finishes.
  ========================================================== */

  function setSendBusy(
    on
  ) {

    busy = on;

    // Do NOT disable the button while busy — clicking it must still
    // reach the submit handler so it can abort. The busy-submit branch
    // calls AbortController.abort(); a disabled button would swallow
    // the click and leave the stream unstoppable.
    $send.disabled =
      false;

    $send.classList.toggle(
      'stop',
      on
    );

    $send
      .querySelector(
        '.send-label'
      )
      .textContent =
      on ? 'Stop' : 'Send';
  }

  function updateStats(
    target,
    ttft,
    tokens,
    elapsed
  ) {

    const stats = target.stats;

    if (!stats) {
      return;
    }

    stats.classList.remove(
      'hidden'
    );

    if (ttft !== null) {

      stats
        .querySelector(
          '.stat:first-child .stat-value'
        )
        .textContent =
        `${ttft.toFixed(2)}s`;
    }

    if (
      tokens > 0 &&
      elapsed > 0
    ) {

      stats
        .querySelector(
          '.stat:nth-child(2) .stat-value'
        )
        .textContent =
        `${(tokens / elapsed).toFixed(1)} tk/s`;
    }
  }

  $form.addEventListener(
    'submit',
    async event => {

      event.preventDefault();

      // Busy => the button is the red Stop button; abort the stream.
      if (busy) {

        if (activeController) {
          activeController.abort();
        }

        return;
      }

      const text =
        $input.value.trim();

      if (!text) {
        return;
      }

      $input.value =
        '';

      resizeInput();

      startTurn(
        text,
        turns.length
      );
    }
  );

  // Re-run a single turn (regenerate). It strips that turn and everything
  // after it from history + the page, then re-sends the same prompt.
  function regenerateTurn(turnIndex) {

    if (busy) {

      return;
    }

    const turn =
      turns[turnIndex];

    if (!turn) {

      return;
    }

    // Keep everything strictly before this turn.
    history.length =
      turn.historyStart;

    // Drop this turn and anything after it from the DOM.
    for (let i = turns.length - 1; i >= turnIndex; i--) {

      const t =
        turns[i];

      if (t) {

        if (t.userEl) t.userEl.remove();
        if (t.assistantEl) t.assistantEl.remove();
      }
    }

    turns.length =
      turnIndex;

    startTurn(
      turn.prompt,
      turnIndex
    );
  }

  // Delegated clicks: regenerate turns + copy code blocks.
  $messages.addEventListener(
    'click',
    event => {

      const regenerate =
        event.target.closest(
          '.regenerate'
        );

      if (regenerate) {

        const index =
          Number(
            regenerate.dataset.turn
          );

        if (
          !Number.isNaN(index)
        ) {

          regenerateTurn(index);
        }

        return;
      }

      const copy =
        event.target.closest(
          '.copy-code'
        );

      if (copy) {

        const codeElement =
          copy
            .closest('.code-block')
            ?.querySelector('pre code');

        const codeText =
          codeElement
            ? codeElement.textContent
            : '';

        if (
          codeText &&
          navigator.clipboard &&
          navigator.clipboard.writeText
        ) {

          navigator.clipboard
            .writeText(codeText)
            .then(
              () => {

                copy.classList.add(
                  'copied'
                );

                copy.textContent =
                  'Copied';

                setTimeout(
                  () => {

                    copy.classList.remove(
                      'copied'
                    );

                    copy.textContent =
                      'Copy';
                  },
                  1400
                );
              }
            );
        }

        return;
      }
    }
  );

  // Shared send path: builds the user + assistant messages, streams the reply,
  // and records the turn so a regenerate button can replay just this prompt.
  async function startTurn(
    prompt,
    turnIndex
  ) {

    const model =
      $model.value;

    if (
      !model ||
      model.includes('Failed') ||
      model.includes('available')
    ) {

      toast(
        'Select a model first'
      );

      return;
    }

    setSendBusy(true);

    activeController =
      new AbortController();

    // Timing for TTFT / tokens-per-second.
    const t0 =
      performance.now();

    let firstTokenAt =
      null;

    // Re-engage stick-to-bottom so the prompt and the streamed reply scroll
    // into view, even if the visitor had scrolled up.
    stickBottom =
      true;

    const historyStart =
      history.length;

    const userMsg =
      createMessage(
        'user',
        prompt
      );

    addRegenerateButton(
      userMsg.article,
      turnIndex
    );

    history.push({
      role:
        'user',

      content:
        prompt
    });

    const target =
      createMessage(
        'assistant'
      );

    target.article.classList.add(
      'cursor'
    );

    turns[turnIndex] =
      {
        prompt,
        userEl:
          userMsg.article,
        assistantEl:
          target.article,
        historyStart
      };

    let accumulated =
      '';

    let totalChars =
      0;

    let stopped =
      false;

      try {

        const token =
          sessionVerified
            ? null
            : await waitForToken();

        const headers = {
          'Content-Type':
            'application/json',

          'X-Session':
            session
        };

        if (token) {

          headers[
            'X-Turnstile'
          ] = token;
        }

        const response =
          await fetch(
            API +
              '/v1/chat/completions',
            {
              method:
                'POST',

              headers,

              signal:
                activeController.signal,

              body:
                JSON.stringify({
                  model,
                  messages:
                    [...history],
                  stream:
                    true
                })
            }
          );

        if (response.ok) {

          sessionVerified =
            true;
        }

        used += 1;

        tickRpm();

        if (!response.ok) {

          let message =
            `HTTP ${response.status}`;

          let code =
            '';

          try {

            const data =
              await response.json();

            message =
              data.error?.message ||
              message;

            code =
              data.error?.code ||
              '';

          } catch {}

          if (
            code ===
              'missing_turnstile' ||
            code ===
              'bad_turnstile'
          ) {

            sessionVerified =
              false;

            message +=
              ' — security check refreshed, try again.';
          }

          target.article.className =
            'message error';

          target.article
            .querySelector(
              '.message-role'
            )
            .textContent =
            'Error';

          target.body.textContent =
            ERROR_MESSAGE;

          history.pop();

          toast(
            'Request failed'
          );

          return;
        }

        const contentType =
          response.headers.get(
            'content-type'
          ) || '';

        if (
          contentType.includes(
            'text/event-stream'
          )
        ) {

          const reader =
            response.body.getReader();

          const decoder =
            new TextDecoder();

          let buffer =
            '';

          while (true) {

            const {
              done,
              value
            } =
              await reader.read();

            if (done) {
              break;
            }

            buffer +=
              decoder.decode(
                value,
                {
                  stream:
                    true
                }
              );

            const lines =
              buffer.split(
                '\n'
              );

            buffer =
              lines.pop();

            for (
              const line of lines
            ) {

              const trimmed =
                line.trim();

              if (
                !trimmed.startsWith(
                  'data:'
                )
              ) {
                continue;
              }

              const payload =
                trimmed
                  .slice(5)
                  .trim();

              if (
                payload ===
                '[DONE]'
              ) {
                continue;
              }

              try {

                const data =
                  JSON.parse(
                    payload
                  );

                const delta =
                  data
                    .choices?.[0]
                    ?.delta;

                const reasoning =
                  delta?.reasoning_content ||
                  '';

                const content =
                  delta?.content ||
                  '';

                if (
                  reasoning ||
                  content
                ) {

                  // First output token (content OR hidden reasoning) =>
                  // mark TTFT. We count both toward token rate (the model
                  // is producing tokens either way) but only display the
                  // final content.
                  if (
                    firstTokenAt ===
                    null
                  ) {

                    firstTokenAt =
                      performance.now();

                    updateStats(
                      target,
                      (firstTokenAt - t0) /
                        1000,
                      0,
                      0
                    );
                  }

                  totalChars +=
                    reasoning.length +
                    content.length;

                  if (content) {

                    accumulated +=
                      content;

                    target.body.innerHTML =
                      renderMarkdown(
                        accumulated
                      );

                    scrollBottom();
                  }

                  // Rough token heuristic: ~4 chars/token.
                  const tokens =
                    Math.round(
                      totalChars /
                        4
                    );

                  const elapsed =
                    (performance.now() - t0) /
                      1000;

                  updateStats(
                    target,
                    (firstTokenAt - t0) /
                      1000,
                    tokens,
                    elapsed
                  );
                }

              } catch {
                // Ignore malformed SSE chunks.
              }

            }
          }

          if (!accumulated) {

            accumulated =
              '(empty response)';

            target.body.innerHTML =
              renderMarkdown(
                accumulated
              );
          }

          history.push({
            role:
              'assistant',

            content:
              accumulated
          });

        } else {

          const data =
            await response.json();

          accumulated =
            data
              .choices?.[0]
              ?.message
              ?.content ||
            '(empty response)';

          target.body.innerHTML =
            renderMarkdown(
              accumulated
            );

          history.push({
            role:
              'assistant',

            content:
              accumulated
          });
        }

      } catch (error) {

        if (
          error &&
          error.name ===
            'AbortError'
        ) {

          // User hit Stop. Keep whatever streamed so far.
          stopped =
            true;

          if (accumulated) {

            target.body.innerHTML =
              renderMarkdown(
                accumulated
              );
          } else {

            accumulated =
              '';

            target.body.textContent =
              'Stopped.';
          }

          target.article
            .querySelector(
              '.message-role'
            )
            .textContent =
            'Stopped';

          if (accumulated) {

            history.push({
              role:
                'assistant',

              content:
                accumulated
            });
          } else {

            history.pop();
          }

          toast(
            'Stopped'
          );
        } else {

          console.error(error);

          target.article.className =
            'message error';

          target.article
            .querySelector(
              '.message-role'
            )
            .textContent =
            'Error';

          target.body.textContent =
            ERROR_MESSAGE;

          history.pop();

          toast(
            'Network error'
          );
        }

      } finally {

        target.article.classList.remove(
          'cursor'
        );

        activeController =
          null;

        // Stats stay on the message: we keep TTFT + tokens/s visible
        // after the stream finishes (per-message row), so nothing to clear.

        addRegenerateButton(
          target.article,
          turnIndex
        );

        setSendBusy(false);

        $input.focus();
      }

    }

  /* ==========================================================
     START
  ========================================================== */

  // The Worker now keeps a per-session Turnstile grant (see index.js), so the
  // widget is only solved once per refresh and is NOT reset on tab restore or
  // refocus. bfcache restores just re-fetch the live model list; if the session
  // grant has lapsed, the next request re-verifies on its own (reset via the
  // missing/bad turnstile error path in the submit handler).
  window.addEventListener(
    'pageshow',
    event => {

      if (event.persisted) {

        loadModels();
      }
    }
  );

  document.addEventListener(
    'visibilitychange',
    () => {

      if (
        document.visibilityState ===
          'visible' &&
        !busy &&
        !sessionVerified
      ) {

        loadModels();
      }
    }
  );

  setTimeout(
    () => {
      $input.focus();
    },
    300
  );

})();
</script>

</body>
</html>
